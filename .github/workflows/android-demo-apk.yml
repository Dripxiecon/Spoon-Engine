name: Spoon Android Demo APK

on:
  push:
    branches:
      - physics-foundation
    paths:
      - "android-demo/**"
      - "engine/physics/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-demo-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android arm64 demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-demo
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spoon-physics-demo-arm64-debug
          path: android-demo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

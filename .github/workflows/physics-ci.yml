name: Spoon Engine Physics CI

on:
  push:
    branches:
      - physics-foundation
  pull_request:
    branches:
      - physics-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux C++17 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSPOON_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  android-ndk-compile:
    name: Android NDK arm64 compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Locate preinstalled Android NDK
        shell: bash
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_PATH" ] || [ ! -f "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            NDK_PATH="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$NDK_PATH"
          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Configure Android arm64
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPOON_BUILD_TESTS=OFF

      - name: Build Android library
        run: cmake --build build-android --parallel 2
